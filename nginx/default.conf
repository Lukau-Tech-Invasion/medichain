# MediChain reverse proxy — development / non-TLS.
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    # Emit RELATIVE redirects. nginx defaults to absolute, rebuilding the URL
    # from server_name and dropping the actual port, so /doctor redirected to
    # http://host/doctor/ -- wrong on any non-80 port and wrong behind a TLS
    # terminator. Relative redirects are correct in every deployment and leak
    # no internal hostname.
    absolute_redirect off;

    # Docker's embedded DNS. Combined with the $api_upstream variable below,
    # this defers upstream resolution to REQUEST time instead of startup time.
    #
    # With a classic `upstream { server api:8080; }` block, nginx resolves the
    # name at boot and refuses to start if it does not exist — so a missing or
    # not-yet-created API container took the whole web tier down, portals and
    # landing page included, even though serving them needs no backend at all.
    # Now the static site always comes up and only /api requests fail (502)
    # while the backend is away. This also means nginx picks up a new API
    # container IP after a restart rather than caching a stale one forever.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "http://api:8080";

    # Allow medical-document uploads.
    client_max_body_size 25m;

    # Server-Sent Events (GET /api/events): disable buffering and hold the
    # connection open so real-time push works through the proxy.
    location /api/events {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # All other API traffic.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Convenience health endpoint for load balancers.
    location = /health {
        proxy_pass $api_upstream/health;
    }

    # API health probes are intentionally separate from nginx's own /healthz.
    # They must reach the upstream so orchestration can distinguish a healthy
    # proxy from an API that cannot serve clinical traffic.
    location = /health/ready {
        proxy_pass $api_upstream/health/ready;
    }

    location = /health/db {
        proxy_pass $api_upstream/health/db;
    }

    # nginx's OWN liveness, answered without touching the API. The container
    # healthcheck must not depend on the upstream: if the API is down, nginx is
    # still correctly serving the portals and the landing page, and reporting it
    # unhealthy would take the whole demo down with the backend.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------
    # Frontends. Both portals are served from sub-paths of this one origin so
    # they share the /api proxy above and same-origin cookies. Each app is
    # built with a matching Vite `base` and react-router basename.
    # ---------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache them hard. index.html is NOT
    # (see below), otherwise a browser keeps loading an old bundle after a
    # redeploy and the portal silently runs stale code against a new API.
    location ~* ^/(doctor|patient)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes like /doctor/patients/PAT-123 are not
    # files on disk, so anything unmatched inside a portal must return that
    # portal's index.html and let react-router resolve it. Without this, a
    # refresh or a pasted deep link 404s.
    location /doctor/ {
        try_files $uri $uri/ /doctor/index.html;
    }

    location /patient/ {
        try_files $uri $uri/ /patient/index.html;
    }

    # Bare /doctor and /patient (no trailing slash) would otherwise 404.
    location = /doctor { return 301 /doctor/; }
    location = /patient { return 301 /patient/; }

    # Never cache the HTML entry points, so a redeploy is picked up immediately.
    location ~* ^/(doctor|patient)/index\.html$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Landing page: the single deterministic demo entry point.
    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }
}
