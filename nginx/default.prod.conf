# MediChain reverse proxy — production / TLS.
# Mounted by docker-compose.prod.yml (overrides default.conf).
# Provide certificates at /etc/nginx/certs/{fullchain.pem,privkey.pem}
# (e.g. via Let's Encrypt / certbot, mounted as a volume).

upstream medichain_api {
    server api:8080;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Emit RELATIVE redirects. nginx defaults to absolute, rebuilding the URL
    # from server_name and dropping the actual port, so /doctor redirected to
    # http://host/doctor/ -- wrong on a non-default port and wrong behind a TLS
    # terminator. Relative redirects are correct in every deployment and leak
    # no internal hostname.
    absolute_redirect off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    location /api/events {
        proxy_pass http://medichain_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://medichain_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's own liveness — deliberately independent of the API upstream, so a
    # backend outage does not mark a correctly-serving proxy unhealthy.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------
    # Frontends. This file is bind-mounted OVER the config baked into the image
    # by docker-compose.prod.yml, so it must repeat the portal serving rules —
    # otherwise a production deployment silently serves a bare 404 at `/` even
    # though the image contains both built portals.
    # ---------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/(doctor|patient)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — deep links and refreshes inside a portal are client-side
    # routes, not files, and must resolve to that portal's index.html.
    location /doctor/  { try_files $uri $uri/ /doctor/index.html; }
    location /patient/ { try_files $uri $uri/ /patient/index.html; }

    location = /doctor  { return 301 /doctor/; }
    location = /patient { return 301 /patient/; }

    location ~* ^/(doctor|patient)/index\.html$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }
}
