# cargo-deny configuration for MediChain
# Run locally with:  cargo deny check
# CI runs this on every push/PR (see .github/workflows/ci.yml).
#
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependency graph for all targets we actually ship.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories (RustSec) — fail the build on known vulnerabilities.
# ---------------------------------------------------------------------------
#
# Horizon HZ-011: this list was previously empty with CI running report-only,
# meaning no advisory had actually been individually reviewed. Each entry below
# was checked for reachability (is the flagged code path something MediChain
# actually exercises) before being added — see the reasoning per entry.
#
# CI still runs this in report-only mode (`.github/workflows/ci.yml`) — that
# is a deliberate, NOT-yet-made decision, not an oversight. Flip it once the
# remaining reachable advisories are resolved or explicitly risk-accepted —
# that is the owner's call, not something to change silently inside a
# remediation pass.
#
# Status 2026-08-25: this gate is GREEN and is now enforced in CI.
#
# The narrative that used to live here (sqlx, and four rustls-webpki advisories
# described as reachable and unfixed) is gone because those advisories no longer
# match any crate in this graph. Keeping a prose changelog of resolved findings
# here is what let it drift; `unused-ignored-advisory` below now makes a stale
# entry a build failure instead of a comment nobody rechecks.
#
# Scope note: this file governs the ROOT workspace only. `blockchain/` is a
# separate cargo workspace with its own lockfile and its own `blockchain/deny.toml`.
# An advisory ignored here says nothing about that graph, and vice versa —
# three entries that used to sit in this list were only ever true of the
# blockchain graph and have been moved there.
[advisories]
version = 2
ignore = [
    # proc-macro-only crate: no runtime attack surface, nothing to reach.
    "RUSTSEC-2024-0436", # paste

    # protobuf's uncontrolled-recursion advisory is a *decoding* (parse) issue.
    # The only consumer in this tree is `prometheus`, which uses protobuf to
    # *serialize* MediChain's own metrics for the `/api/metrics` scrape
    # endpoint — MediChain never decodes attacker-supplied protobuf bytes.
    "RUSTSEC-2024-0437",

    # libsecp256k1 is pulled in generically by sp-core's multi-curve support.
    # MediChain's signing exclusively uses sr25519 (Schnorrkel) — no code path
    # in this codebase constructs or verifies a secp256k1 key/signature.
    "RUSTSEC-2025-0161",

    # lopdf's stack-overflow advisory requires *parsing* a maliciously deeply
    # nested PDF. `api/src/pdf.rs` only calls `PdfDocument::new(...)` to
    # generate PDFs (via `printpdf`) — this codebase never loads/parses an
    # externally supplied PDF file.
    "RUSTSEC-2026-0187",

    # ttf-parser (unmaintained, no CVE): only parses bundled, trusted font
    # files for PDF/QR rendering — never a user-uploaded font.
    "RUSTSEC-2026-0192",

    # --- TEMPORARILY ACCEPTED UPSTREAM RISK, not "ignored" ------------------
    # Both are RustSec INFO/unmaintained notices with no patched version, both
    # arrive through `subxt`, and `subxt`'s version is coupled to the chain
    # runtime's metadata format (see the note in the root Cargo.toml). Moving
    # either one independently means moving subxt independently, which is the
    # "green audit, broken blockchain" failure mode. They leave with the
    # coordinated Subxt/runtime upgrade and not before.
    # Full record, including review trigger and removal criterion:
    #   docs/TECHNICAL_DEBT_REGISTER.md -- "two accepted upstream advisories".
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, unmaintained, no patched release. Reaches the graph only via subxt-macro, a proc-macro crate: it executes on the build host during compilation and ships in no deployed artifact. Build-time supply-chain debt, not runtime attack surface. Removal criterion: a subxt release compatible with the runtime metadata contract that no longer depends on it." },
    { id = "RUSTSEC-2026-0215", reason = "smallstr, unmaintained, all versions affected, no patched release and no drop-in replacement offered. Reaches the graph via subxt -> frame-decode -> scale-info-legacy, an internal implementation detail of a dependency MediChain does not control. Removal criterion: same coordinated subxt/runtime upgrade." },

    # --- Reviewed but NOT ignored — reachable, no safe fix landed yet ---
    # These remain intentionally absent from this list. Once CI is switched to
    # blocking mode (see the header comment above), leaving them unignored is
    # what makes them fail the build — that is deliberate: silencing a
    # reachable, unfixed advisory would defeat the point of this gate. See the
    # decision log / HZ-011 finding for the owner-facing writeup:
    #   RUSTSEC-2024-0363 (sqlx) — RESOLVED 2026-07-29 by upgrading to
    #     sqlx 0.8.6. Kept listed here only so the history is legible; it is
    #     no longer an open item.
    #   RUSTSEC-2026-0049, 0098, 0099, 0104 (rustls-webpki CRL / name-
    #     constraint issues) — reachable via every outbound HTTPS call
    #     (IPFS, national-ID APIs, SMS/notifications, blockchain node,
    #     telehealth), but exploitation requires a malicious/compromised CA or
    #     a MITM presenting a certificate crafted to the specific edge case
    #     each advisory describes. No fixed release available via `cargo
    #     update` at review time. Re-run `cargo deny check advisories`
    #     periodically until upstream ships a fix.
]

# ---------------------------------------------------------------------------
# License compliance — only permissive / health-data-safe licenses allowed.
# A copyleft dependency (e.g. GPL) must be reviewed before being added here.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.8
# Same ratchet for licence exceptions: if an upgrade removes the crate an
# exception was written for, the now-pointless exception fails the build.
unused-license-exception = "deny"

# MediChain's own crates are proprietary (root LICENSE) and carry `publish =
# false`. They have no SPDX identifier to allow, and adding a permissive one
# would state in package metadata the opposite of what LICENSE says. This is
# cargo-deny's mechanism for exactly that case: skip unpublished workspace
# crates, keep checking every third-party dependency.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Per-crate exceptions. Scoped to one named crate on purpose: a licence that is
# acceptable for one reviewed dependency must not silently become acceptable
# for every future one, which is what adding it to `allow` above would do.
# ---------------------------------------------------------------------------
#
# `webpki-roots` and `webpki-root-certs` ship the Mozilla/CCADB certificate
# authority dataset used as the TLS trust store. CDLA-Permissive-2.0 is a *data*
# licence covering that certificate data, not a software licence on application
# code, and its principal redistribution condition is making the agreement text
# available. Reviewed and accepted for TLS trust-root use only.
#
# NOTE both crate NAMES are listed. `webpki-root-certs` is a separate published
# crate from `webpki-roots`, and each is in the graph at two major versions
# (0.26.11 and 1.0.9) via `sqlx-core`. Excepting only `webpki-roots` leaves the
# other name rejected and the gate red.
#
# Obligation carried by this exception: the distributed product's third-party
# notices must include the CDLA-Permissive-2.0 text.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# ---------------------------------------------------------------------------
# Dependency bans — flag duplicate versions and wildcard requirements.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "warn"
# Deny crates we never want pulled in transitively (add as needed).
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Source control — only crates.io and explicitly-allowed git sources.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
