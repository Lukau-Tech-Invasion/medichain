[package]
name = "medichain-api"
version = "0.1.0"
edition = "2021"
# The repository LICENSE is a proprietary, all-rights-reserved grant
# (Lukau Invasion (Pty) Ltd). There is no SPDX identifier for it, so it is
# named by file rather than by expression -- declaring a permissive SPDX id
# here would grant, in package metadata, exactly the rights that LICENSE
# withholds. `publish = false` keeps that metadata off a public registry.
license-file = "../LICENSE"
publish = false
description = "MediChain REST API Server - Emergency medical records access"

[[bin]]
name = "medichain-api"
path = "src/main.rs"

[dependencies]
# Web framework
# HTTP/1.1 only, on purpose. Nginx terminates TLS and HTTP/2 at the edge
# (`nginx/default.prod.conf`: `http2 on`) and proxies to this service with
# `proxy_http_version 1.1`, so actix's `http2` default feature compiled an
# HTTP/2 stack this process never speaks -- and with it `h2 0.3.27`, which
# actix-http still pins and which carries RUSTSEC-2026-0258 (unbounded empty
# DATA frames). Removing the capability removes the advisory; an unused
# protocol implementation is attack surface, not a safety net.
#
# `macros` is required: 424 handlers use the `#[get]`/`#[post]` attributes.
# `cookies`, `compress-*` and `unicode` are dropped because nothing here reads
# a cookie, installs `Compress`, or routes a non-ASCII path.
actix-web = { version = "4.9", default-features = false, features = ["macros"] }
actix-cors = "0.7"
actix-rt = "2.10"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"

# Async traits and error handling
async-trait = "0.1"
thiserror = "1.0"
subxt = { workspace = true }
# parity-scale-codec removed 2026-07-31: the API crate never used it (no
# `codec::`, no Encode/Decode derives). The pallets declare it themselves.
sp-core = { workspace = true, features = ["std"] }
subxt-signer = { workspace = true }

# Cryptography for NFC simulation
sha3 = "0.10"
hex = "0.4"

# JWT authentication (Phase 9.4) and TOTP multi-factor auth (Phase 11.3)
jsonwebtoken = "9"
totp-rs = { version = "5.6", default-features = false, features = ["otpauth", "gen_secret"] }

# Observability (Phase 8.2): Prometheus metrics + structured JSON logging
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-log = "0.2"

# Async task debugger (Phase 12.1) — opt-in, see the `tokio-console` feature below.
console-subscriber = { version = "0.4", optional = true }

# PDF generation (Phase 13.3)
printpdf = "0.7"

# QR Code generation
# QR rendering only. `qrcode`'s default features pull `image` with *its*
# defaults, which is every codec the crate supports -- including AVIF, whose
# encoder is `rav1e`, a full AV1 implementation that also drags in the
# NCSA-licensed `libfuzzer-sys` and fails `cargo deny check licenses`.
# MediChain writes exactly one format: an 8-bit greyscale QR bitmap as PNG
# (`support.rs`, `nfc_simulator.rs`). Ask for that and nothing else.
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# IPFS client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Crypto module
medichain-crypto = { path = "../crypto" }

# PostgreSQL Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "rust_decimal"
] }

# Decimal handling for precise medical measurements
rust_decimal = { version = "1.32", features = ["serde-with-str", "db-postgres"] }

# Environment configuration
dotenvy = "0.15"

[features]
default = ["postgres"]
postgres = []
# Async task debugger (Phase 12.1). Requires building with `tokio_unstable`
# (tokio's task-tracking instrumentation is opt-in at compile time, not just
# a runtime toggle): `RUSTFLAGS="--cfg tokio_unstable" cargo run -p medichain-api
# --features tokio-console`, then connect with the `tokio-console` CLI
# (`cargo install tokio-console`) against the default gRPC endpoint.
tokio-console = ["dep:console-subscriber"]

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
# Property-based testing (Phase 12.2)
proptest = "1"
# Mock HTTP server for outbound-integration tests (Phase 5.3) — verifies the
# real Africa's Talking/FCM request shape against a local server instead of
# a live sandbox this environment has no credentials for.
wiremock = "0.6"
