# =============================================================================
# MediChain — Production overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml -f docker-compose.backup-offsite.yml -f docker-compose.prod.yml up -d --build
#
# REQUIRED before running:
#   * Set strong POSTGRES_PASSWORD plus every required API secret below in .env.
#     Compose rejects missing values and the API rejects known demo values.
#   * Provide TLS certificates at ./nginx/certs/{fullchain.pem,privkey.pem}
#     (e.g. from Let's Encrypt / certbot).
#   * Configure the encrypted local and off-site pgBackRest repositories and
#     rehearse a restore before admitting real data.
# =============================================================================

services:
  api:
    restart: always
    environment:
      IS_DEMO: "false"
      REQUIRE_SIGNATURES: "true"
      APP_ENV: "production"
      MEDICHAIN_STORAGE: postgres
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must list HTTPS origins}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?ENCRYPTION_KEYS is required}
      PATIENT_SEARCH_INDEX_KEY: ${PATIENT_SEARCH_INDEX_KEY:?PATIENT_SEARCH_INDEX_KEY is required}
      # The API fails closed outside demo mode without this value, but making it
      # required here prevents a production monitoring deployment that starts
      # successfully while every Prometheus scrape is rejected with 401.
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      NATIONAL_ID_HASH_KEY: ${NATIONAL_ID_HASH_KEY:?NATIONAL_ID_HASH_KEY is required}
      NATIONAL_ID_VERIFICATION_MODE: "live"
      SMS_INBOUND_WEBHOOK_SECRET: ${SMS_INBOUND_WEBHOOK_SECRET:?SMS_INBOUND_WEBHOOK_SECRET is required}
      # Disabled until a qualified private provider is configured. If enabled,
      # startup rejects public Jitsi and missing provider credentials.
      TELEHEALTH_ENABLED: ${TELEHEALTH_ENABLED:-false}
      TELEHEALTH_PROVIDER: ${TELEHEALTH_PROVIDER:-jitsi}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-}
      JITSI_APP_ID: ${JITSI_APP_ID:-}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
      # Sealed audit stream (ADR-0010). The signing key is required outside
      # demo mode and has no default; the API refuses AUDIT_CHECKPOINT_SINK=none
      # in production, so checkpoints go to the audit_checkpoints volume
      # (declared in docker-compose.yml). Copy that volume to write-once storage:
      # on the database's own host it proves only what the host did not rewrite.
      AUDIT_SEAL_SIGNING_KEY: ${AUDIT_SEAL_SIGNING_KEY:?AUDIT_SEAL_SIGNING_KEY is required}
      AUDIT_CHECKPOINT_SINK: filesystem
      AUDIT_CHECKPOINT_DIR: /var/lib/medichain/audit-checkpoints

  # `!override` is REQUIRED on every `ports:` below. Compose MERGES list-valued
  # fields across files, so a bare `ports: []` is a no-op and the base file's
  # publications survive into production. This file previously used bare
  # `ports: []` and therefore still exposed PostgreSQL on 5432 and pgAdmin on
  # 5050 to the host — the documented protection did not exist. Same defect
  # class as Horizon HZ-018, which was fixed in
  # docker-compose.horizon-isolated.yml but never applied here.
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Do NOT publish the database to the host in production.
    ports: !override []

  pgadmin:
    # pgAdmin is a development convenience — keep it off the public network.
    # `profiles` keeps it out of a default `up` entirely; the port reset is
    # belt-and-braces for anyone who runs it explicitly.
    profiles: ["debug"]
    ports: !override []
    restart: "no"

  nginx:
    restart: always
    ports: !override
      - "443:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  # ===========================================================================
  # Observability (OPT-IN — `docker compose ... --profile monitoring up`)
  # Prometheus scrapes the API's /api/metrics; Grafana auto-provisions the
  # bundled dashboard + datasource. Config lives in docs/observability/.
  # ===========================================================================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: medichain_prometheus
    restart: always
    environment:
      # Shared with the API service; Compose mounts it as a runtime secret
      # instead of placing it in the scrape configuration.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    secrets:
      - metrics_token
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/observability/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    networks:
      - medichain_network

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: medichain_grafana
    restart: always
    environment:
      # Compose interpolates profile services during configuration, so this is
      # required for every production Compose invocation even when the optional
      # monitoring profile is not started. That prevents an accidental Grafana
      # administrator with a public default credential.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Monitoring is reachable only through an operator-controlled tunnel or
    # private network; never publish Grafana on the clinic host.
    ports: !override []
    volumes:
      - ./docs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/medichain-api.json:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    networks:
      - medichain_network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

secrets:
  metrics_token:
    environment: METRICS_TOKEN
