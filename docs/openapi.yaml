openapi: 3.0.3
info:
  title: MediChain API
  description: |
    This specification covers selected routes, not the complete API. The registered
    handlers under api/src remain authoritative until route and schema coverage is complete.
    MediChain REST API provides secure access to patient identity, medical records,
    and access control functionality for a national health ID system with a sealed,
    tamper-evident audit stream (see ADR-0010).
    
    © 2025 Lukau Invasion (Pty) Ltd. All rights reserved.
    
    ## Authentication
    
    MediChain uses credential-proof sign-in. Protected requests present the
    issued bearer access token; browser refresh tokens use an HttpOnly cookie.
    A caller-supplied identity header is never authentication.
    
    ## Role-Based Access Control
    
    All endpoints implement RBAC with the following roles:
    - **Admin** - Full system access, user management
    - **Doctor** - Patient registration, medical record access/edit
    - **Nurse** - Patient registration, medical record access/edit
    - **LabTechnician** - Lab results upload, limited record access
    - **Pharmacist** - Prescription verification, medication records
    - **Paramedic** - Emergency care workflows
    - **Patient** - Access to own records
    
    ## Audit sealing
    
    Access-log rows and audit events are Merkle-batched, hash-chained, signed
    with Ed25519 and exported as checkpoints. Responses that describe a
    sealable item carry a `seal_status` (`pending`, `sealed` or `exported`;
    `pending` means not yet batched). Sealing is asynchronous and never
    refuses a request.
    
    ## Pagination
    
    List endpoints support pagination via query parameters:
    - `page` - Page number (1-indexed, default: 1)
    - `limit` - Items per page (default: 20, max: 100)
    
  version: "1.0.0"
  contact:
    name: MediChain Support
    email: support@medichain.ng
  license:
    name: Proprietary
    url: https://medichain.ng/license

servers:
  - url: http://localhost:8090
    description: Local development server
  - url: https://api.medichain.ng
    description: Production server

tags:
  - name: Health
    description: API health check endpoints
  - name: Authentication
    description: Credential and session authentication endpoints
  - name: Patients
    description: Patient registration and management
  - name: Records
    description: Encrypted medical documents (PostgreSQL-backed when a database is configured)
  - name: Access Logs
    description: Access audit trail
  - name: Lab Results
    description: Lab result submission and approval workflow
  - name: NFC Cards
    description: NFC health card management
  - name: Clinical
    description: Clinical documentation (Triage, SOAP, GCS, Vitals)
  - name: Staff
    description: Staff/user management (Admin only)

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns API health status
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/db:
    get:
      tags: [Health]
      summary: Database health check
      description: Returns database connection status
      security: []
      responses:
        '200':
          description: Database is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  connected:
                    type: boolean

  /api/auth/bootstrap:
    post:
      tags: [Authentication]
      summary: Bootstrap admin account
      description: |
        Creates the initial admin account. Only works once and requires 
        MEDICHAIN_BOOTSTRAP_KEY environment variable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Admin account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '409':
          description: First administrator already provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register pending staff account
      description: An administrator with privileged assurance creates a pending staff account and receives a one-time activation code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRegisterResponse'
        '400':
          description: Invalid request
        '403':
          description: Insufficient permissions

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with a credential proof
      description: Authenticate an active account with its login identifier and client-derived proof. MFA accounts also require a TOTP code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials or MFA required
        '429':
          description: Account temporarily locked
        '503':
          description: Credential storage unavailable

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: Returns the authenticated user's information
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Unauthorized

  /api/auth/credentials/redeem:
    post:
      tags: [Authentication]
      summary: Redeem an activation or reset code
      description: Stores the new credential proof and activates an eligible account. A staff account pending approval remains pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemCredentialRequest'
      responses:
        '200':
          description: Credential redeemed and session issued, or MFA enrollment required
        '202':
          description: Credential redeemed; staff approval is still pending
        '401':
          description: Code invalid or expired
        '409':
          description: Login ID already taken

  /api/auth/credentials/change:
    post:
      tags: [Authentication]
      summary: Change the signed-in account's credential proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCredentialRequest'
      responses:
        '200':
          description: Credential changed and other sessions ended
        '401':
          description: Current credential proof invalid

  /api/register:
    post:
      tags: [Patients]
      summary: Register new patient
      description: Register a new patient with national ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '201':
          description: Patient registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPatientResponse'
        '403':
          description: Only healthcare providers can register patients

  /api/patients:
    get:
      tags: [Patients]
      summary: List all patients
      description: Get paginated list of all registered patients (healthcare providers only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated patient list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatients'
        '403':
          description: Only healthcare providers can list patients

  /api/patients/{patient_id}:
    get:
      tags: [Patients]
      summary: Get patient by ID
      description: Get a single patient's information
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '404':
          description: Patient not found

    put:
      tags: [Patients]
      summary: Update patient
      description: Update patient information (healthcare providers only)
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated
        '403':
          description: Insufficient permissions
        '404':
          description: Patient not found

  /api/patients/{patient_id}/verify:
    get:
      tags: [Access Logs]
      summary: Verify a patient's sealed audit rows
      description: >-
        Returns each row's seal status, batch hash and signature check, the
        capsule commitment comparison, and the public key needed to verify
        exported checkpoints.
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'

  /api/access-logs/{patient_id}:
    get:
      tags: [Access Logs]
      summary: Get access logs
      description: Get paginated access logs for a patient
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Access logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLogsResponse'
        '403':
          description: Patients can only view their own logs

  /api/emergency/access:
    post:
      tags: [Patients]
      summary: Obtain a grant-bound emergency summary
      description: Requires an active professional work context, an approved device and a valid NFC tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nfc_tag_id, device_id, work_context_id, reason_code]
              properties:
                nfc_tag_id: { type: string }
                device_id: { type: string }
                work_context_id: { type: string }
                reason_code: { type: string }
                reason_text: { type: string }
      responses:
        '200':
          description: Minimum emergency summary and bounded grant issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantBoundEmergencyAccessResponse'
        '403':
          description: Emergency access denied

  /api/my-records:
    get:
      tags: [Records]
      summary: Get my records
      description: Get the authenticated patient's own records
      responses:
        '200':
          description: Patient's records
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_id:
                    type: string
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicalRecord'
        '403':
          description: Only patients can access this endpoint

  /api/records/{patient_id}:
    get:
      tags: [Records]
      summary: List patient records
      description: Get paginated medical records for a patient
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Medical records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecords'
        '403':
          description: Patients can only view their own records

  /api/records/upload:
    post:
      tags: [Records]
      summary: Upload medical record
      description: Encrypt and store a medical document. A PostgreSQL-backed API stores encrypted blobs in its database; the response retains a legacy `ipfs_hash` field name for the content identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, content_base64, filename, content_type, record_type]
              properties:
                patient_id:
                  type: string
                content_base64:
                  type: string
                  description: Base64 encoded file content
                filename:
                  type: string
                content_type:
                  type: string
                  example: application/pdf
                record_type:
                  type: string
                  enum: [lab_result, imaging, prescription, clinical_note]
                encrypted:
                  type: boolean
                  default: true
                  description: Explicit false is rejected.
      responses:
        '201':
          description: Record uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRecordResponse'

  /api/records/download:
    post:
      tags: [Records]
      summary: Download medical record
      description: Download and decrypt an authorized document by its content and metadata identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_hash, metadata_hash]
              properties:
                content_hash:
                  type: string
                metadata_hash:
                  type: string
      responses:
        '200':
          description: Record content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadRecordResponse'

  /api/lab/submit:
    post:
      tags: [Lab Results]
      summary: Submit lab results
      description: Submit lab results for doctor approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLabResultRequest'
      responses:
        '201':
          description: Lab result submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLabResultResponse'

  /api/lab/pending:
    get:
      tags: [Lab Results]
      summary: Get pending lab results
      description: Get all pending lab results awaiting review
      responses:
        '200':
          description: Pending lab results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingLabResultsResponse'

  /api/lab/submissions:
    get:
      tags: [Lab Results]
      summary: List lab submissions
      description: Get paginated list of all lab result submissions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: Filter by status
      responses:
        '200':
          description: Lab submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLabSubmissions'

  /api/lab/submissions/{submission_id}/review:
    post:
      tags: [Lab Results]
      summary: Review lab submission
      description: Approve or reject a lab result submission
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                comments:
                  type: string
      responses:
        '200':
          description: Lab result reviewed
        '404':
          description: Submission not found

  /api/nfc/generate:
    post:
      tags: [NFC Cards]
      summary: Generate NFC card
      description: Generate a new NFC health card for a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id]
              properties:
                patient_id:
                  type: string
      responses:
        '201':
          description: NFC card generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateNFCCardResponse'

  /api/nfc/cards:
    get:
      tags: [NFC Cards]
      summary: List NFC cards
      description: Get paginated list of all NFC cards (Admin only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: NFC cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNFCCards'
        '403':
          description: Only Admin can list cards

  /api/clinical/triage:
    post:
      tags: [Clinical]
      summary: Create triage assessment
      description: Create a new triage assessment for a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTriageRequest'
      responses:
        '201':
          description: Triage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAssessment'

  /api/clinical/triage/queue:
    get:
      tags: [Clinical]
      summary: Get triage queue
      description: Get all patients in triage queue ordered by ESI level
      responses:
        '200':
          description: Triage queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  queue:
                    type: array
                    items:
                      $ref: '#/components/schemas/TriageAssessment'
                  total:
                    type: integer

  /api/clinical/soap:
    post:
      tags: [Clinical]
      summary: Create SOAP note
      description: Create a new SOAP note for a patient encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSOAPNoteRequest'
      responses:
        '201':
          description: SOAP note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOAPNote'

  /api/clinical/gcs:
    post:
      tags: [Clinical]
      summary: Create GCS assessment
      description: Create a Glasgow Coma Scale assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGCSRequest'
      responses:
        '201':
          description: GCS assessment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlasgowComaScale'

  /api/clinical/vitals:
    post:
      tags: [Clinical]
      summary: Record vital signs
      description: Record a new vital signs reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordVitalsRequest'
      responses:
        '201':
          description: Vitals recorded

  /api/users:
    get:
      tags: [Staff]
      summary: List users
      description: Get paginated list of all users (Admin only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '403':
          description: Only Admin can list users

  /api/roles/assign:
    post:
      tags: [Staff]
      summary: Assign role
      description: Assign a role to a user (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, name, role]
              properties:
                user_id:
                  type: string
                  format: uuid
                name:
                  type: string
                username:
                  type: string
                role:
                  type: string
                  enum: [Doctor, Nurse, LabTechnician, Pharmacist, Paramedic, Patient]
      responses:
        '200':
          description: Role assigned
        '403':
          description: Only Admin can assign roles

  /api/roles/revoke:
    delete:
      tags: [Staff]
      summary: Revoke role
      description: Revoke a user's role (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Role revoked
        '403':
          description: Only Admin can revoke roles

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (1-indexed)
    
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Items per page

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: MediChain API is running
        audit_seal:
          $ref: '#/components/schemas/AuditSealHealth'

    SealStatus:
      type: string
      enum: [pending, sealed, exported]
      description: >-
        Where an audit row is in the sealed stream. `pending` = not yet batched.

    AuditSealHealth:
      type: object
      properties:
        unsealed_events:
          type: integer
        last_sealed_at:
          type: string
          format: date-time
          nullable: true
        last_exported_at:
          type: string
          format: date-time
          nullable: true
        sink:
          type: string
          enum: [none, filesystem]
        signing:
          type: string
          enum: [ed25519, unsigned]

    SealKey:
      type: object
      nullable: true
      properties:
        key_id:
          type: string
        algorithm:
          type: string
          enum: [ed25519]
        public_key:
          type: string

    VerifyRow:
      type: object
      properties:
        seal_status:
          type: string
          enum: [pending, sealed, exported]
          nullable: true
          description: null = unbatched
        batch_hash:
          type: string
          nullable: true
        signature:
          type: string
          enum: [valid, invalid, unsigned]
          nullable: true
        sealed_at:
          type: string
          format: date-time
          nullable: true
        exported_at:
          type: string
          format: date-time
          nullable: true

    VerifyResponse:
      type: object
      properties:
        seal_key:
          $ref: '#/components/schemas/SealKey'
        capsule:
          type: string
          enum: [match, mismatch, unsealed, none]
          description: >-
            Recomputed capsule commitment compared with the sealed one.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/VerifyRow'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    CurrentUser:
      type: object
      required: [user_id, name, role, status, permissions]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        username:
          type: string
        linked_patient_id:
          type: string
        status:
          type: string
        permissions:
          type: object
          properties:
            is_admin: { type: boolean }
            is_healthcare_provider: { type: boolean }
            can_view_medical_records: { type: boolean }
            can_edit_medical_records: { type: boolean }

    StaffRegisterRequest:
      type: object
      required: [name, role, login_id]
      properties:
        name:
          type: string
        login_id:
          type: string
        role:
          type: string
          enum: [Doctor, Nurse, LabTechnician, Pharmacist, Paramedic]
        email:
          type: string
          format: email

    StaffRegisterResponse:
      type: object
      required: [success, user_id, role, status, activation_required, credential_code, credential_expires_at]
      properties:
        success:
          type: boolean
        user_id:
          type: string
          format: uuid
        role: { type: string }
        status: { type: string }
        activation_required: { type: boolean }
        credential_code: { type: string }
        credential_expires_at:
          type: string
          format: date-time

    PasswordLoginRequest:
      type: object
      required: [identifier, auth_proof]
      properties:
        identifier: { type: string }
        auth_proof:
          type: string
          description: Client-derived authentication proof; do not send a raw password.
        totp_code: { type: string }

    RedeemCredentialRequest:
      type: object
      required: [identifier, code, auth_proof]
      properties:
        identifier: { type: string }
        code: { type: string }
        auth_proof: { type: string }
        username: { type: string }

    ChangeCredentialRequest:
      type: object
      required: [current_auth_proof, new_auth_proof]
      properties:
        current_auth_proof: { type: string }
        new_auth_proof: { type: string }

    TokenResponse:
      type: object
      required: [success, access_token, token_type, expires_in, mfa, mfa_required]
      properties:
        success: { type: boolean }
        access_token: { type: string }
        refresh_token:
          type: string
          description: Present only for non-browser clients requesting body transport.
        token_type: { type: string }
        expires_in: { type: integer }
        mfa: { type: boolean }
        mfa_required: { type: boolean }
        user:
          $ref: '#/components/schemas/CredentialUser'

    CredentialUser:
      type: object
      required: [user_id, name, role]
      properties:
