<!doctype html><html><head><meta charset="utf-8"><title>My health</title><link rel="stylesheet" href="mock.css"></head>
<body><div class="phone" data-tab="health">
  <header class="appbar"><h2>My health</h2><span class="iconbtn" aria-label="Search my health"><i data-i="search"></i></span></header>
  <main class="content" style="gap:14px">
    <!-- Big, labelled tiles for the four things people open most. -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <a class="card pad-sm col" style="gap:6px"><span class="ic iconbtn" style="background:rgb(var(--sunken));color:rgb(var(--primary))"><i data-i="file"></i></span><p class="b">Records</p><p class="xs muted">75 documents</p></a>
      <a class="card pad-sm col" style="gap:6px"><span class="ic iconbtn" style="background:rgb(var(--sunken));color:rgb(var(--primary))"><i data-i="flask"></i></span><p class="b">Lab results</p><p class="xs muted">1 new</p></a>
      <a class="card pad-sm col" style="gap:6px"><span class="ic iconbtn" style="background:rgb(var(--sunken));color:rgb(var(--primary))"><i data-i="pill"></i></span><p class="b">Medications</p><p class="xs muted">1 due today</p></a>
      <a class="card pad-sm col" style="gap:6px"><span class="ic iconbtn" style="background:rgb(var(--sunken));color:rgb(var(--primary))"><i data-i="pulse"></i></span><p class="b">Vital signs</p><p class="xs muted">BP 128/82 · 3 days ago</p></a>
    </div>
    <section class="col" style="gap:8px">
      <h3>Track and check</h3>
      <div class="card list">
        <div class="li"><span class="ic"><i data-i="bell"></i></span><div class="grow b">Medicine reminders</div><i data-i="chev" class="chev"></i></div>
        <div class="li"><span class="ic"><i data-i="trend"></i></span><div class="grow b">Lab trends</div><i data-i="chev" class="chev"></i></div>
        <div class="li"><span class="ic"><i data-i="thermo"></i></span><div class="grow b">Symptom diary</div><i data-i="chev" class="chev"></i></div>
        <div class="li"><span class="ic"><i data-i="clipboard"></i></span><div class="grow b">Check a symptom</div><i data-i="chev" class="chev"></i></div>
        <div class="li"><span class="ic"><i data-i="watch"></i></span><div class="grow b">Wearables</div><i data-i="chev" class="chev"></i></div>
        <div class="li"><span class="ic"><i data-i="book"></i></span><div class="grow b">Medical history</div><i data-i="chev" class="chev"></i></div>
      </div>
    </section>
  </main>
  <span class="mock-tag">Mockup · synthetic data</span>
</div><script src="chrome.js"></script><script src="icons.js"></script></body></html>
