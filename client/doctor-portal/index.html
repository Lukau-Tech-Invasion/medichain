    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Applied before first paint, deliberately inline and blocking.
      //
      // React cannot do this: by the time a store has rehydrated and an effect
      // has run, the light theme has already been painted. That is the flash of
      // white every dark-mode user sees, and worse, it is why the theme
      // sometimes appeared not to apply at all -- zustand's `persist` restores
      // the preference AFTER the first render, so an initializer that ran early
      // applied the default and nothing re-applied the restored value.
      //
      // `color-scheme` matters as much as the class: without it the browser
      // paints form controls, scrollbars and autofill from the light palette,
      // so a dark page still shows a white input with white text in it.
      (function () {
        try {
          var stored = localStorage.getItem('medichain-theme-preference');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* A blocked storage API must not stop the page rendering. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration with Force Update -->
    <script>
      // Force clear old caches and localStorage on version mismatch
      const APP_VERSION = 'v5';
      const storedVersion = localStorage.getItem('medichain_app_version');
      
      if (storedVersion !== APP_VERSION) {
        console.log('[MediChain] New version detected, clearing all caches...');
        // Clear all localStorage except the version marker
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('medichain')) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        
        // Clear all caches
        if ('caches' in window) {
          caches.keys().then(names => {
            names.forEach(name => {
              console.log('[MediChain] Deleting cache:', name);
              caches.delete(name);
            });
          });
        }
        
        // Unregister old service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(reg => {
              console.log('[MediChain] Unregistering old SW:', reg.scope);
              reg.unregister();
            });
          });
        }
        
        localStorage.setItem('medichain_app_version', APP_VERSION);
        // Reload to get fresh content
        setTimeout(() => location.reload(), 100);
      }
      
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%BASE_URL%sw.js?v=' + APP_VERSION)
            .then(registration => {
              console.log('SW registered:', registration.scope);
            })
            .catch(error => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
