# cargo-deny configuration for the MediChain **blockchain** workspace.
#
# Run locally with:
#   cargo deny --manifest-path blockchain/Cargo.toml check
#
# ---------------------------------------------------------------------------
# Why this file exists separately from the repo-root deny.toml
# ---------------------------------------------------------------------------
# `blockchain/` is its own cargo workspace with its own Cargo.lock. The
# repo-root `supply-chain` CI job invokes cargo-deny from the root, and a
# workspace-scoped command reports success for crates it never looked at — the
# same scoping trap `.github/workflows/ci.yml` already documents for the test
# job. The result was that **1171 dependencies — the entire Substrate
# networking, consensus and crypto stack — had no advisory, licence or source
# scanning at all**, while the API's comparatively small tree was fully covered.
#
# ---------------------------------------------------------------------------
# Licences: why this list is wider than the root's, and deliberately so
# ---------------------------------------------------------------------------
# The root workspace is permissive-only. This one cannot be: the Polkadot SDK
# ships a substantial part of its node stack under the GPL. Measured against
# the resolved lockfile on 2026-08-20:
#
#   * 48 crates  GPL-3.0-or-later WITH Classpath-exception-2.0  (the `sc-*`
#     Substrate client crates). The Classpath exception explicitly permits
#     linking without imposing the GPL on the linked work.
#   * 17 crates  GPL-3.0-only, **no exception, no permissive alternative**
#     (`polkadot-*`, `staging-xcm*`, `tracing-gum*`). Every one of them enters
#     the graph through a single dependency — `frame-benchmarking-cli` — which
#     `medichain-node` links unconditionally. They are absent from
#     `medichain-runtime`'s graph entirely.
#
# That distinction is the whole point of allowing them explicitly here rather
# than globally: the allow-list is the record of a decision, so if a GPL-3.0-only
# crate ever appears on a *new* path this file is what makes someone look.
# See docs/TECHNICAL_DEBT_REGISTER.md for the open question about whether the
# node should carry that dependency at all.
#
# NOTE ON COMPLETENESS: this list was derived from the 1074 of 1171 locked
# packages available in the local registry cache; 97 could not be read offline.
# `licenses` is therefore report-only in CI for now — it is a discovery gate,
# not yet a blocking one. Flip it once a full CI run confirms the list is
# complete.

[graph]
# Default features only — `all-features` would switch on `runtime-benchmarks`
# and `try-runtime`, pulling in a graph that no shipped binary contains. The
# question this file answers is "what does the node we actually build link".
all-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories (RustSec)
# ---------------------------------------------------------------------------
# The Substrate tree carries upstream advisories this project does not control.
# Each entry below was checked on 2026-08-26 by asking cargo two specific
# questions rather than by assertion:
#
#   1. Can it move?   `cargo update --precise` reports the exact upstream
#      constraint that blocks it, quoted per entry.
#   2. What links it? `cargo tree -p medichain-runtime -i <crate>` says
#      whether the crate is in the on-chain runtime's graph or only the node
#      binary's.
#
# Question 2 matters because the two artifacts have different exposure. The
# WASM runtime is what goes on chain. `medichain-node` is a client binary and,
# per CLAUDE.md, is NOT part of the production Compose profile: production
# points `SUBSTRATE_WS_URL` at an externally operated node. A node-only
# advisory is therefore about an artifact this repository does not currently
# deploy — which narrows it, and does not make it disappear, because the
# repository does build and document that node (docs/BLOCKCHAIN_NODE.md).
#
# One advisory was genuinely FIXED in this pass rather than accepted:
# RUSTSEC-2026-0258 (h2 unbounded empty DATA frames) left the graph via a
# precise lockfile bump, h2 0.4.15 -> 0.4.19. It is absent from this list
# because it is absent from the tree.
[advisories]
version = 2
ignore = [
    # ---- migrated from the root deny.toml on 2026-08-25 --------------------
    # These three were reviewed for reachability against THIS graph and then
    # recorded in the root file by mistake: none of the three crates appears in
    # the root workspace's lockfile at all, so the root gate never evaluated
    # them. Moving them keeps the analysis attached to the graph it describes.
    #
    # Deprecated by its author; arrives through the Substrate/FRAME
    # WASM-execution stack.
    "RUSTSEC-2022-0061", # parity-wasm
    # proc-macro-only: runs at compile time, ships in no artifact.
    "RUSTSEC-2024-0370", # proc-macro-error
    # Cross-platform monotonic-time shim. Unmaintained notice only, no known
    # vulnerability, and no successor changes its transitive pull-in
    # (parking_lot / Substrate stack).
    "RUSTSEC-2024-0384", # instant

    # ---- present in BOTH workspaces; the root file already carries these ----
    # proc-macro-only crate: no runtime attack surface.
    "RUSTSEC-2024-0436", # paste
    # Pulled in generically by sp-core's multi-curve support. MediChain signs
    # exclusively with sr25519 (Schnorrkel); no code path here constructs or
    # verifies a secp256k1 key or signature.
    "RUSTSEC-2025-0161", # libsecp256k1

    # ---- reviewed 2026-08-26: blocked by a quoted upstream constraint -------
    #
    # These are accepted, not silenced. Each carries the exact reason it cannot
    # move and the single condition that removes it. If any becomes movable and
    # is still listed here, the entry is wrong and should fail review.
    { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber, ANSI escape sequences in logged user input can poison an operator's terminal. Patched in 0.3.20. CANNOT MOVE: sc-tracing v47.0.0 requires `tracing-subscriber = \"=0.3.19\"` — an exact pin, not a caret range, so no lockfile bump reaches the fix (`cargo update --precise 0.3.20` reports `candidate versions found which didn't match: 0.3.20`). Present in the runtime's graph via sp-tracing as well as the node's. Impact is log-display spoofing to an operator reading raw terminal output, not code execution or data disclosure. Removal criterion: an sc-tracing release that relaxes the exact pin — i.e. a coordinated Polkadot SDK upgrade, which is the only thing that can move it." },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto, O(n^2) name compression during message encoding — CPU exhaustion. Patched in 0.26.1. CANNOT MOVE: litep2p v0.14.3 -> hickory-resolver v0.25.2 requires `hickory-proto = \"^0.25\"`, so 0.26.1 is a semver-major step the dependent must take first. NODE-ONLY: `cargo tree -p medichain-runtime -i hickory-proto` finds no match, so it is absent from the on-chain runtime and reachable only through the node's peer-discovery DNS path. Removal criterion: a litep2p/sc-network release on hickory 0.26." },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto, NSEC3 closest-encloser proof validation can enter an unbounded loop on cross-zone responses. RustSec reports no safe upgrade: every published version is affected. Requires DNSSEC validation of a hostile response. NODE-ONLY, same graph position and same evidence as RUSTSEC-2026-0119. Removal criterion: an upstream hickory release that fixes it, then the same litep2p step." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, unmaintained, no patched release. Build-time only: it executes on the build host during compilation and ships in no artifact, on chain or otherwise. NODE-ONLY — absent from medichain-runtime's graph. The root workspace accepts this same advisory on the same reasoning; see the note there. Removal criterion: the dependents stop using it." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash, unmaintained notice with no CVE and no known vulnerability. RustSec reports no safe upgrade. NODE-ONLY — absent from medichain-runtime's graph. This is supply-chain maintenance debt rather than an exploitable weakness; it is listed so that its status is a decision on record and not an omission. Removal criterion: the dependents move to a maintained hasher." },
]

# Now set, because the list above is now complete: every advisory this graph
# reports is either fixed or carries a reviewed entry, so `cargo deny
# --manifest-path blockchain/Cargo.toml check advisories` is green. That makes
# the ratchet affordable and, more to the point, necessary: an accepted
# advisory whose crate later leaves the tree becomes a comment nobody rechecks,
# which is precisely how the root file drifted before this rule was added
# there. A stale entry is now a build failure.
unused-ignored-advisory = "deny"

[licenses]
version = 2
allow = [
    # --- permissive: same set as the root workspace ---
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",

    # --- GPL, unavoidable in the Polkadot SDK node stack ---
    # Linking permitted by the exception; does not affect the licence of the
    # work that links it.
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
    # No exception. Present only via `frame-benchmarking-cli` in
    # `medichain-node`. Allowed so the build is honest about what it links,
    # NOT because the coupling is considered settled.
    "GPL-3.0-only",
    "GPL-3.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — the one check here that is ENFORCED.
# ---------------------------------------------------------------------------
# Verified clean on 2026-08-20: the lockfile resolves 1166 packages from the
# crates.io registry and zero from any git source, and contains no reference to
# the pre-monorepo `paritytech/substrate` repository. A git or vendored source
# appearing in this tree would mean an unpinned, unaudited supply-chain entry
# point into the node that signs blocks — so this one blocks.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
