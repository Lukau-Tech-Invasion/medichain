[package]
name = "pallet-access-control"
version = "0.1.0"
edition = "2021"
# `license.workspace = true` (MIT), and it was missing entirely until
# 2026-09-10. `cargo deny --manifest-path blockchain/Cargo.toml check licenses`
# reported all three MediChain pallets as `error[unlicensed]`, and the check is
# report-only for this workspace, so the failure had never been read. Both
# CLAUDE.md and the technical-debt register assert these are MIT; the manifests
# said nothing at all.
#
# MIT is accurate here: the measurement in the register's 2026-08-20 entry found
# the runtime graph carries 4 GPL-with-Classpath-exception crates and ZERO
# strict GPL-3.0-only ones. The 17 strict crates are the node binary's, through
# frame-benchmarking-cli, and `blockchain/node/Cargo.toml` now declares that.
license.workspace = true

[dependencies]
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
sp-std = { workspace = true }
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
# Not optional and not std-gated: `#[pallet::genesis_config]` derives
# Serialize/Deserialize on the generated struct unconditionally, so `Role` must
# implement them in the no_std wasm build too.
serde = { workspace = true }

[dev-dependencies]
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }

[features]
default = ["std"]
std = [
	"frame-support/std",
	"frame-system/std",
	"frame-benchmarking?/std",
	"sp-std/std",
	"parity-scale-codec/std",
	"scale-info/std",
	"serde/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
]


[lib]
name = "pallet_access_control"
path = "src/lib.rs"
crate-type = ["lib"]
