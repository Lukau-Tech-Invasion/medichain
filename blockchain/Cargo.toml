[workspace]
resolver = "2"
members = [
    "pallets/access-control",
    "pallets/medical-records",
    "pallets/patient-identity",
    "runtime",
    "node",
]

[workspace.package]
authors = ["Lukau Invasion (Pty) Ltd"]
edition = "2021"
homepage = "https://github.com/Lukau-Tech-Invasion/medichain"
license = "MIT"
repository = "https://github.com/Lukau-Tech-Invasion/medichain"

# =============================================================================
# Polkadot SDK version policy
# -----------------------------------------------------------------------------
# Every crate below comes from the SAME polkadot-sdk release: `polkadot-stable2606`
# (umbrella version 2606.0.0). Versions were not chosen by hand -- they were read
# out of a resolved lockfile for `polkadot-sdk = "=2606.0.0"` so the set is
# internally coherent by construction. If you bump one, re-derive them all the
# same way rather than bumping individually.
#
# WHY THIS RELEASE AND NOT AN OLDER ONE
# -------------------------------------
# The pallets were originally written against frame-support 38 (stable2409).
# That release, and every release up to and including sc-service 0.59, can no
# longer be resolved from crates.io at all: `core2 0.4.0` is yanked, and
# `cid` -> `litep2p` -> `sc-network-types` pins `core2 ^0.4` with no unyanked
# version available. Verified by bisecting sc-service 0.34 through 0.60 --
# only 0.60.0 resolves. This is a forced upgrade, not a preference.
# =============================================================================
[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = [
    "derive",
] }
parity-scale-codec = { version = "3.7.5", default-features = false, features = [
    "derive",
] }
scale-info = { version = "2.11.6", default-features = false, features = [
    "derive",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
jsonrpsee = { version = "0.24.11", features = ["server"] }

# --- FRAME ---------------------------------------------------------------
frame-benchmarking = { version = "49.0.0", default-features = false }
frame-benchmarking-cli = { version = "58.0.0" }
frame-executive = { version = "48.0.0", default-features = false }
frame-metadata-hash-extension = { version = "0.16.0", default-features = false }
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
frame-system-benchmarking = { version = "49.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false }

# --- FRAME pallets -------------------------------------------------------
pallet-aura = { version = "48.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-grandpa = { version = "49.0.0", default-features = false }
pallet-sudo = { version = "49.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-transaction-payment-rpc = { version = "52.0.0" }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }

# --- Substrate primitives ------------------------------------------------
sp-api = { version = "43.0.0", default-features = false }
sp-block-builder = { version = "43.0.0", default-features = false }
sp-blockchain = { version = "46.0.0" }
sp-consensus = { version = "0.49.0" }
sp-consensus-aura = { version = "0.49.0", default-features = false }
sp-consensus-grandpa = { version = "30.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-genesis-builder = { version = "0.24.0", default-features = false }
sp-inherents = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-keyring = { version = "48.0.0", default-features = false }
sp-keystore = { version = "0.49.0" }
sp-offchain = { version = "43.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }
sp-session = { version = "45.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
sp-storage = { version = "25.0.0", default-features = false }
