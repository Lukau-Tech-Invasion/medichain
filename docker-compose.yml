# MediChain Docker Compose Configuration
# PostgreSQL + pgAdmin for development and demo

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medichain_postgres
    restart: unless-stopped
    environment:
      # Credentials are interpolated from the environment / .env file.
      # Defaults are DEV-ONLY; production MUST set these (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER:-medichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medichain_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-medichain}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medichain -d medichain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medichain_network

  # =============================================================================
  # IPFS Node (Kubo)
  # API at http://localhost:5001
  # Gateway at http://localhost:8080
  # =============================================================================
  ipfs:
    image: ipfs/kubo:latest
    container_name: medichain_ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - medichain_network

  # =============================================================================
  # MediChain API
  # =============================================================================
  api:
    build:
      # Context is the repo root so the workspace members (crypto, pallets) are
      # available to the build; see api/Dockerfile.
      context: .
      dockerfile: api/Dockerfile
      args:
        # Local Compose artifacts are deliberately not release-provenance
        # evidence. CI supplies the immutable checkout SHA instead.
        SOURCE_REVISION: ${SOURCE_REVISION:-local-unverified}
    container_name: medichain_api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Explicit: the API's own default is 8090 (8080 collides with the IPFS
      # gateway on a dev host). Inside this container 8080 is free and nginx
      # proxies to `api:8080`, so pin it here rather than changing nginx.
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-medichain}:${POSTGRES_PASSWORD:-medichain_dev_2024}@postgres:5432/${POSTGRES_DB:-medichain}
      # The API otherwise defaults to its in-memory repository even when a
      # healthy PostgreSQL pool exists. That made every browser-created patient
      # and clinical workflow disappear on the next API restart.
      MEDICHAIN_STORAGE: postgres
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      PATIENT_SEARCH_INDEX_KEY: ${PATIENT_SEARCH_INDEX_KEY:-}
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080
      # Production secrets — set these in .env (no insecure defaults baked in).
      SESSION_SECRET: ${SESSION_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Optional in development; required by the monitoring profile to protect
      # the internal Prometheus scrape endpoint.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      IS_DEMO: ${IS_DEMO:-true}
      # Pass-through, NOT a default. `GET /api/auth/demo-credentials` answers
      # only when this is set, and it returns sign-in credentials — so it must
      # stay off in any deployment that inherits this file. Unset here it is
      # empty, exactly as before; a developer running the browser suites opts in
      # with MEDICHAIN_DEV_MODE=1 in their shell or .env.
      #
      # Without the pass-through the variable could not reach the container at
      # all, so the doctor-portal Playwright suites clicked a demo button that
      # never rendered and reported a bare 30-second timeout.
      MEDICHAIN_DEV_MODE: ${MEDICHAIN_DEV_MODE:-}
      # Keep production-safe defaults while allowing the synthetic browser
      # harness to opt into a larger per-minute budget. The API rejects zero
      # and invalid values, so a malformed override cannot disable limiting.
      MEDICHAIN_RATE_LIMIT_ANONYMOUS: ${MEDICHAIN_RATE_LIMIT_ANONYMOUS:-60}
      MEDICHAIN_RATE_LIMIT_AUTHENTICATED: ${MEDICHAIN_RATE_LIMIT_AUTHENTICATED:-120}
      # The dispensing policy is deployment-supplied on purpose: the API ships
      # no built-in drug schedule (`api/src/dispensing_policy.rs`), so a
      # deployment that does not provide one cannot dispense a policy-governed
      # medication at all — every attempt answers
      # `503 DISPENSING_POLICY_UNAVAILABLE`. That was this stack's state, and
      # nothing in this file said so.
      #
      # Overridable, and it should be overridden: the file mounted below is the
      # **example**. A real deployment mounts its own approved policy at the
      # same path, and the version string in it is what ends up recorded against
      # every secondary-verification decision.
      DISPENSING_POLICY_PATH: ${DISPENSING_POLICY_PATH:-/app/policy/dispensing_policy.json}

      # =======================================================================
      # Feature configuration.
      #
      # Everything below was read by the API and had no way into the container,
      # so the feature it governs was off in the running stack however the
      # deployment was configured. `docker exec medichain_api env` listed
      # fourteen variables while `api/src` read seventy-six.
      #
      # Each is a pass-through with no default, so an unset variable keeps the
      # API's own fail-closed behaviour rather than inventing a posture here.
      # =======================================================================

      # Facility. Unset, the API treats appointment times as UTC and says so at
      # startup -- telehealth join windows and reminders are then wrong by the
      # facility's real offset.
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-}
      CLINIC_UTC_OFFSET_MINUTES: ${CLINIC_UTC_OFFSET_MINUTES:-}

      # Posture. `APP_ENV=production` turns on the startup validations that
      # refuse a contradictory configuration.
      APP_ENV: ${APP_ENV:-}
      REQUIRE_SIGNATURES: ${REQUIRE_SIGNATURES:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOW_HTTP_SENSITIVE: ${ALLOW_HTTP_SENSITIVE:-}
      MEDICHAIN_DOMAIN: ${MEDICHAIN_DOMAIN:-}
      MEDICHAIN_APP_URL: ${MEDICHAIN_APP_URL:-}
      MEDICHAIN_BOOTSTRAP_KEY: ${MEDICHAIN_BOOTSTRAP_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      RUST_LOG: ${RUST_LOG:-}

      # Blockchain anchoring. With no SUBSTRATE_WS_URL the API logs
      # "blockchain features disabled" and every anchored write is a typed
      # error rather than a fabricated hash.
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-}
      SUBSTRATE_WS_URL: ${SUBSTRATE_WS_URL:-}
      SUBSTRATE_SIGNING_KEY: ${SUBSTRATE_SIGNING_KEY:-}
      SUBSTRATE_ALLOW_DEV_SIGNER: ${SUBSTRATE_ALLOW_DEV_SIGNER:-}

      # Telehealth. Without JITSI_DOMAIN the service points at the public
      # meet.jit.si with unauthenticated rooms, which is not somewhere PHI
      # should go; docker-compose.jitsi.yml self-hosts it.
      TELEHEALTH_ENABLED: ${TELEHEALTH_ENABLED:-}
      TELEHEALTH_PROVIDER: ${TELEHEALTH_PROVIDER:-}
      TELEHEALTH_SECRET: ${TELEHEALTH_SECRET:-}
      # The XMPP domain the JWT is scoped to. NOT the browser's URL: a
      # self-hosted Jitsi on any port but 443 makes those differ, and
      # `auth.localhost:8443` is not a valid XMPP domain.
      JITSI_DOMAIN: ${JITSI_DOMAIN:-}
      # Where the browser actually connects. Defaults to https://<domain>.
      JITSI_PUBLIC_URL: ${JITSI_PUBLIC_URL:-}
      JITSI_APP_ID: ${JITSI_APP_ID:-}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
      JITSI_ROOM_PREFIX: ${JITSI_ROOM_PREFIX:-}
      DAILY_API_KEY: ${DAILY_API_KEY:-}

      # Email. Unset SMTP_HOST means a regulator breach notice is never sent
      # and never faked; docker-compose.services.yml runs a local catcher.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ALLOW_PLAINTEXT: ${SMTP_ALLOW_PLAINTEXT:-}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-}
      REGULATOR_NOTIFICATION_EMAIL: ${REGULATOR_NOTIFICATION_EMAIL:-}
      SECURITY_OFFICER_PHONE: ${SECURITY_OFFICER_PHONE:-}

      # SMS and push. Both default to OFF inside the API, so these must be set
      # to `true` as well as credentialed before anything is sent.
      SMS_ENABLED: ${SMS_ENABLED:-}
      SMS_GLOBAL_DISABLE: ${SMS_GLOBAL_DISABLE:-}
      SMS_INBOUND_WEBHOOK_SECRET: ${SMS_INBOUND_WEBHOOK_SECRET:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SMS_URL: ${AT_SMS_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      FCM_ENABLED: ${FCM_ENABLED:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_ACCESS_TOKEN: ${FCM_ACCESS_TOKEN:-}

      # Identity verification. `NATIONAL_ID_VERIFICATION_MODE` is validated at
      # startup against APP_ENV, so production cannot silently run on stubs.
      NATIONAL_ID_VERIFICATION_MODE: ${NATIONAL_ID_VERIFICATION_MODE:-}
      NATIONAL_ID_HASH_KEY: ${NATIONAL_ID_HASH_KEY:-}
      FAYDA_API_KEY: ${FAYDA_API_KEY:-}
      GHANA_CARD_API_KEY: ${GHANA_CARD_API_KEY:-}

      # Language and dictation.
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      GOOGLE_TRANSLATE_ENDPOINT: ${GOOGLE_TRANSLATE_ENDPOINT:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-}
      GOOGLE_STT_API_KEY: ${GOOGLE_STT_API_KEY:-}
      GOOGLE_STT_ENDPOINT: ${GOOGLE_STT_ENDPOINT:-}

      # Emergency audit availability. `deny` is the safe default; the
      # governance-approved `durable_defer` additionally requires a durable
      # path and an approved maximum age.
      EMERGENCY_AUDIT_AVAILABILITY_MODE: ${EMERGENCY_AUDIT_AVAILABILITY_MODE:-}
      EMERGENCY_DEFERRED_AUDIT_DIR: ${EMERGENCY_DEFERRED_AUDIT_DIR:-}
      EMERGENCY_DEFERRED_AUDIT_MAX_AGE_SECS: ${EMERGENCY_DEFERRED_AUDIT_MAX_AGE_SECS:-}

      # Optional clinical data overlays.
      DRUG_INTERACTIONS_DATA_PATH: ${DRUG_INTERACTIONS_DATA_PATH:-}
    volumes:
      # Read-only, and a single file rather than a directory, so the container
      # cannot rewrite the policy it is being governed by.
      - ${DISPENSING_POLICY_FILE:-./api/data/dispensing_policy.example.json}:/app/policy/dispensing_policy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    networks:
      - medichain_network

  # =============================================================================
  # pgAdmin - Database Administration UI
  # Access at http://localhost:5050
  # Login: admin@medichain.dev / admin
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medichain_pgadmin
    restart: unless-stopped
    environment:
      # DEV-ONLY defaults; override in .env for any shared/production deployment.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@medichain.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medichain_network

  # =============================================================================
  # Nginx Reverse Proxy
  # Routes http://localhost/ → API (and /api/events SSE). TLS is added in
  # docker-compose.prod.yml. NOTE: IPFS already binds host :8080, so the API is
  # reached through nginx on :80 rather than a direct host port.
  # =============================================================================
  # Reverse proxy AND frontend host. Previously this ran the stock nginx image
  # with only a proxy config, so `/` was a bare 404 and the compose stack served
  # no UI at all — a demo had to be started by hand with two Vite dev servers.
  # It now builds both portals and serves them:
  #     /          landing page (single deterministic entry point + demo banner)
  #     /doctor/   clinician portal
  #     /patient/  patient app
  #     /api/      proxied to the API
  # Build context is the repo root because the image needs both client/ and
  # nginx/; the Dockerfile lives at client/Dockerfile.
  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_DEMO_CREDENTIALS_ENABLED: ${VITE_DEMO_CREDENTIALS_ENABLED:-false}
    image: medichain-web:local
    container_name: medichain_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Probes nginx's OWN /healthz, not the proxied API /health: if the backend
      # is down the portals are still being served correctly, and marking the
      # proxy unhealthy would take the whole demo down with the backend.
      # Alpine wget prefers IPv6 for localhost while nginx binds IPv4, so the
      # loopback address is explicit.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - medichain_network

  # =============================================================================
  # Substrate Node — NOT DEFINED HERE ON PURPOSE
  # -----------------------------------------------------------------------------
  # There was a `substrate-node` service here that built `node/Dockerfile`. That
  # file never existed, and the node source has since moved to `blockchain/node/`,
  # so the service could not have started under any profile. It has been removed
  # rather than left as a stanza that looks like working configuration.
  #
  # To run a node for local development, run the binary directly — that is the
  # supported and verified path:
  #
  #     scripts/blockchain/run-dev-node.sh --persist
  #     scripts/blockchain/qualify-node.sh
  #
  # and point the API at it with SUBSTRATE_WS_URL=ws://127.0.0.1:9944.
  # See docs/BLOCKCHAIN_NODE.md.
  #
  # Production supplies a separately qualified node through SUBSTRATE_WS_URL; the
  # API fails closed when that dependency is absent and never fabricates a
  # transaction hash.
  #
  # Note also: the old stanza passed `--rpc-external`, which binds RPC on all
  # interfaces. Do not reintroduce that without an access-control story.
  # =============================================================================

# =============================================================================
# Volumes for Data Persistence
# =============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  ipfs_data:
    driver: local

# =============================================================================
# Network Configuration
# =============================================================================
networks:
  medichain_network:
    driver: bridge
