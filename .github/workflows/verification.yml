name: Development Verification

on:
  push:
    branches: [main, development/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medichain
          POSTGRES_PASSWORD: medichain_dev_2024
          POSTGRES_DB: medichain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medichain -d medichain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://medichain:medichain_dev_2024@localhost:5432/medichain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace -- --test-threads=1

  client:
    name: Client builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Build doctor portal
        run: npm run build:doctor
      - name: Build patient app
        run: npm run build:patient
