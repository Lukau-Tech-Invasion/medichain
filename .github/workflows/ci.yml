# MediChain CI Workflow
# Runs on every push and pull request to main branch

name: MediChain CI

on:
    push:
        branches: [main, development/**]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    # ============================================================================
    # Endpoint authorization gate (Horizon HZ-010 / HZ-019)
    # ----------------------------------------------------------------------------
    # MediChain authorizes per handler rather than at a runtime chokepoint. That
    # works, but a NEW handler can silently forget to check. This gate makes the
    # invariant enforceable: every HTTP handler must authenticate, authorize, or
    # be a justified entry in the script's public/delegated allowlists. A hard
    # gate on purpose — a new unprotected endpoint should fail the build, not a
    # review.
    # ============================================================================
    endpoint-auth:
        name: Endpoint authorization gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Every endpoint has an auth decision
              run: python scripts/check-endpoint-auth.py

    # ============================================================================
    # Rust Backend (Substrate pallets, API, crypto, node)
    # ============================================================================
    rust:
        name: Rust CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt --all -- --check

            # Report-only until the lint cleanup lands (see docs/NEXT_WEEK_TODO.md,
            # Stage 2 — ~238 clippy findings). Re-make this a hard gate (drop
            # continue-on-error) once warnings are driven to zero.
            - name: Run Clippy (linting, report-only)
              continue-on-error: true
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build
              run: cargo build --release

            # Default features only: the `postgres` feature's repository tests need a
            # live PostgreSQL service (tracked: add a DB-service CI job to cover them).
            - name: Run tests
              run: cargo test

            - name: Install cargo-audit
              run: cargo install cargo-audit

            # Report-only: the substrate/subxt transitive tree carries upstream
            # advisories we don't directly control (mirrors the supply-chain job).
            - name: Security audit (report-only)
              continue-on-error: true
              run: cargo audit

    # ============================================================================
    # Supply-Chain Security (cargo-deny advisories/licenses/bans + SBOM)
    # ============================================================================
    supply-chain:
        name: Supply Chain
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            # Enforced (under our control): no banned crates, crates.io sources only.
            # Config lives in deny.toml at the repo root.
            - name: cargo-deny (bans + sources, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check
                  command-arguments: bans sources

            # Advisories: curated (Horizon HZ-011) — every RUSTSEC ID in the
            # dependency tree has been individually reviewed for reachability;
            # see deny.toml's [advisories] section for the reasoning per ID.
            # Still report-only: 5 reachable advisories (sqlx, 4x
            # rustls-webpki) remain genuinely open with no safe fix available,
            # so flipping to blocking now would fail every future PR on
            # pre-existing issues rather than ones it introduces. Flip
            # `continue-on-error` to `false` once those are resolved or
            # explicitly risk-accepted.
            - name: cargo-deny (advisories, report-only pending sqlx/webpki fixes)
              uses: EmbarkStudios/cargo-deny-action@v2
              continue-on-error: true
              with:
                  command: check
                  command-arguments: advisories

            # Licenses: NOT part of the HZ-011 advisories review — separate,
            # still-unaddressed issues (deprecated SPDX identifiers on the
            # subxt crates, an unmatched Unicode-DFS-2016 allowance). Kept
            # report-only and split from advisories so resolving one doesn't
            # block on the other.
            - name: cargo-deny (licenses, report-only)
              uses: EmbarkStudios/cargo-deny-action@v2
              continue-on-error: true
              with:
                  command: check
                  command-arguments: licenses

            # Generate a CycloneDX Software Bill of Materials for compliance.
            - name: Install cargo-cyclonedx
              run: cargo install cargo-cyclonedx --locked

            - name: Generate SBOM (CycloneDX)
              run: cargo cyclonedx --format json --all

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-cyclonedx
                  path: "**/*.cdx.json"
                  if-no-files-found: warn

    # ============================================================================
    # Snyk (11.2) — dependency vulnerability scanning, Rust + frontend.
    # Needs a SNYK_TOKEN repo secret (Settings → Secrets and variables → Actions)
    # and the SNYK_ENABLED repo variable set to "true" to activate — deliberately
    # opt-in so adding the token alone doesn't start failing builds before it's
    # configured the way this team wants (severity threshold, project scope).
    # ============================================================================
    snyk:
        name: Snyk
        runs-on: ubuntu-latest
        if: ${{ vars.SNYK_ENABLED == 'true' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Snyk — Rust dependencies (Cargo.lock)
              continue-on-error: true
              uses: snyk/actions/rust@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --severity-threshold=high

            - name: Snyk — frontend dependencies (npm)
              continue-on-error: true
              uses: snyk/actions/node@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  command: test
                  args: --severity-threshold=high --all-projects
              working-directory: client

    # ============================================================================
    # TypeScript/React Client Apps (doctor-portal, patient-app)
    # ============================================================================
    client:
        name: Client CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Build doctor portal
              run: npm run build:doctor

            - name: Build patient app
              run: npm run build:patient

            - name: Run linting
              run: npm run lint --workspaces --if-present

    # ============================================================================
    # Performance budgets — Lighthouse CI (Phase 12.1)
    # ============================================================================
    # Report-only for now (perf is environment-noisy in CI); budgets live in
    # client/.lighthouserc.json and docs/PERFORMANCE_BUDGETS.md.
    lighthouse:
        name: Lighthouse Budgets
        runs-on: ubuntu-latest
        continue-on-error: true

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Build patient app
              run: npm run build:patient

            - name: Install Lighthouse CI
              run: npm install -g @lhci/cli@0.13.x

            - name: Run Lighthouse CI (patient app)
              run: lhci autorun --config=.lighthouserc.json --collect.staticDistDir=patient-app/dist

    # ============================================================================
    # WebAssembly Crypto Module
    # ============================================================================
    wasm:
        name: WASM Crypto CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM module
              working-directory: client/wasm-crypto
              run: wasm-pack build --target web

            - name: Run WASM tests
              working-directory: client/wasm-crypto
              run: wasm-pack test --node
