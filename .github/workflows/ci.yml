# MediChain CI Workflow
# Runs on every push and pull request to main branch

name: MediChain CI

on:
    push:
        branches: [main, development/**]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    # ============================================================================
    # Endpoint authorization gate (Horizon HZ-010 / HZ-019)
    # ----------------------------------------------------------------------------
    # MediChain authorizes per handler rather than at a runtime chokepoint. That
    # works, but a NEW handler can silently forget to check. This gate makes the
    # invariant enforceable: every HTTP handler must authenticate, authorize, or
    # be a justified entry in the script's public/delegated allowlists. A hard
    # gate on purpose — a new unprotected endpoint should fail the build, not a
    # review.
    # ============================================================================
    endpoint-auth:
        name: Endpoint authorization gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Every endpoint has an auth decision
              run: python scripts/check-endpoint-auth.py

    # ============================================================================
    # Rust Backend (Substrate pallets, API, crypto, node)
    # ============================================================================
    rust:
        name: Rust CI
        runs-on: ubuntu-latest

        # The four `repositories::postgres::tests` need a live database. Without
        # this service they do not skip — they FAIL, with `PoolTimedOut` after a
        # 30s connect timeout each. Mirrors verification.yml's service so the two
        # workflows exercise the same tests against the same database, rather
        # than one quietly covering less than the other.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: medichain
                    POSTGRES_PASSWORD: medichain_dev_2024
                    POSTGRES_DB: medichain
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U medichain -d medichain"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgres://medichain:medichain_dev_2024@localhost:5432/medichain

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt --all -- --check

            # Report-only until the lint cleanup lands (see docs/NEXT_WEEK_TODO.md,
            # Stage 2 — ~238 clippy findings). Re-make this a hard gate (drop
            # continue-on-error) once warnings are driven to zero.
            - name: Run Clippy (linting, report-only)
              continue-on-error: true
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build
              run: cargo build --release

            # The PostgreSQL service declared on this job supplies DATABASE_URL,
            # so the repository tests run for real here rather than failing on a
            # connect timeout. (This comment previously said such a job was still
            # "tracked" — it is the service above.)
            - name: Run tests
              run: cargo test

            - name: Install cargo-audit
              run: cargo install cargo-audit

            # Report-only: the substrate/subxt transitive tree carries upstream
            # advisories we don't directly control (mirrors the supply-chain job).
            - name: Security audit (report-only)
              continue-on-error: true
              run: cargo audit

    # ============================================================================
    # Blockchain workspace (pallets + runtime + node)
    # ----------------------------------------------------------------------------
    # `blockchain/` is a SEPARATE cargo workspace on a different Polkadot SDK
    # release from the API. That matters for CI correctness: the `rust` job above
    # runs `cargo fmt --all` / `cargo clippy --all-targets` / `cargo test` with no
    # `-p` flags, so it only ever sees the root workspace. When the pallets moved
    # out of it they left that job's scope entirely, and a workspace-scoped
    # command reports success for crates it never compiled. Without this job the
    # 60 pallet tests would simply stop running and nothing would go red.
    # ============================================================================
    blockchain:
        name: Blockchain (pallets + runtime)
        runs-on: ubuntu-latest

        env:
            # REQUIRED. The repository root has its own rust-toolchain.toml pinning
            # `channel = "stable"`, and rustup resolves the nearest such file
            # walking up from the working directory. Because cargo is invoked from
            # the repo root via --manifest-path, that root file outranks both the
            # toolchain action below and blockchain/rust-toolchain.toml.
            # RUSTUP_TOOLCHAIN outranks the files, so it is what actually pins the
            # compiler here. Without it the build runs on `stable`, which has
            # neither the wasm targets nor rust-src.
            RUSTUP_TOOLCHAIN: '1.92.0'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # `rust-src` is not optional: substrate-wasm-builder compiles the
            # runtime with `-Z build-std` and fails outright without the standard
            # library sources.
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.92.0
              with:
                  components: rustfmt, clippy, rust-src
                  targets: wasm32v1-none, wasm32-unknown-unknown

            # clang/libclang are required by the rocksdb bindgen build in the
            # node's dependency tree; protobuf by the networking stack.
            - name: Install native build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y protobuf-compiler libprotobuf-dev clang libclang-dev

            - name: Cache cargo registry and build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      blockchain/target
                  # Image and toolchain are in the key on purpose; see the long
                  # note in blockchain-node-release.yml. `runner.os` alone is
                  # "Linux" for every Ubuntu image, so a cache built on one can be
                  # restored onto another with an incompatible glibc.
                  key: ${{ runner.os }}-ubuntu-latest-rust1.92.0-blockchain-${{ hashFiles('blockchain/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-ubuntu-latest-rust1.92.0-blockchain-

            - name: Check formatting
              run: cargo fmt --manifest-path blockchain/Cargo.toml --all -- --check

            # Enforced here, unlike the root `rust` job's clippy, which is
            # deliberately report-only while pre-existing findings are worked down.
            # This code is new, so it starts clean and stays clean.
            - name: Clippy (enforced)
              run: >-
                  cargo clippy --manifest-path blockchain/Cargo.toml
                  --workspace --all-targets -- -D warnings

            - name: Build runtime (generates WASM)
              run: cargo check --manifest-path blockchain/Cargo.toml -p medichain-runtime

            - name: Build node
              run: cargo check --manifest-path blockchain/Cargo.toml -p medichain-node

            # Guards the role-bootstrap regression: pallet-access-control's genesis
            # config is the only way UserRoles can ever be populated.
            - name: Run blockchain tests
              run: cargo test --manifest-path blockchain/Cargo.toml --workspace

    # ============================================================================
    # Supply-Chain Security (cargo-deny advisories/licenses/bans + SBOM)
    # ============================================================================
    supply-chain:
        name: Supply Chain
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            # Enforced (under our control): no banned crates, crates.io sources only.
            # Config lives in deny.toml at the repo root.
            - name: cargo-deny (bans + sources, enforced)
              uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check
                  command-arguments: bans sources

            # Advisories: curated (Horizon HZ-011) — every RUSTSEC ID in the
            # dependency tree has been individually reviewed for reachability;
            # see deny.toml's [advisories] section for the reasoning per ID.
            # Still report-only: 5 reachable advisories (sqlx, 4x
            # rustls-webpki) remain genuinely open with no safe fix available,
            # so flipping to blocking now would fail every future PR on
            # pre-existing issues rather than ones it introduces. Flip
            # `continue-on-error` to `false` once those are resolved or
            # explicitly risk-accepted.
            - name: cargo-deny (advisories, report-only pending sqlx/webpki fixes)
              uses: EmbarkStudios/cargo-deny-action@v2
              continue-on-error: true
              with:
                  command: check
                  command-arguments: advisories

            # Licenses: NOT part of the HZ-011 advisories review — separate,
            # still-unaddressed issues (deprecated SPDX identifiers on the
            # subxt crates, an unmatched Unicode-DFS-2016 allowance). Kept
            # report-only and split from advisories so resolving one doesn't
            # block on the other.
            - name: cargo-deny (licenses, report-only)
              uses: EmbarkStudios/cargo-deny-action@v2
              continue-on-error: true
              with:
                  command: check
                  command-arguments: licenses

            # Generate a CycloneDX Software Bill of Materials for compliance.
            - name: Install cargo-cyclonedx
              run: cargo install cargo-cyclonedx --locked

            - name: Generate SBOM (CycloneDX)
              run: cargo cyclonedx --format json --all

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-cyclonedx
                  path: "**/*.cdx.json"
                  if-no-files-found: warn

    # ============================================================================
    # Snyk (11.2) — dependency vulnerability scanning, Rust + frontend.
    # Needs a SNYK_TOKEN repo secret (Settings → Secrets and variables → Actions)
    # and the SNYK_ENABLED repo variable set to "true" to activate — deliberately
    # opt-in so adding the token alone doesn't start failing builds before it's
    # configured the way this team wants (severity threshold, project scope).
    # ============================================================================
    snyk:
        name: Snyk
        runs-on: ubuntu-latest
        if: ${{ vars.SNYK_ENABLED == 'true' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Snyk — Rust dependencies (Cargo.lock)
              continue-on-error: true
              uses: snyk/actions/rust@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --severity-threshold=high

            # NO `working-directory:` HERE. It is valid only on `run:` steps, and
            # putting it on a `uses:` step makes GitHub reject the ENTIRE workflow
            # file before running anything — every job in this file, not just this
            # one, and not just this job's own failure. That is exactly what
            # happened: this workflow failed in 0s on every push from 2026-07-27
            # to 2026-08-05 and not one of its eight jobs ever ran, including the
            # endpoint-authorization gate and the dual-backend e2e matrix.
            #
            # It went unnoticed because `verification.yml` publishes checks named
            # "Rust format and tests" and "Client builds", which are green and read
            # like full CI coverage at a glance.
            #
            # Note this job is `if:`-disabled by default, so an invalid key in a
            # job that never runs still took down everything else.
            #
            # `--all-projects` scans from the repository root and picks up
            # client/**/package.json anyway, so no directory change is needed.
            - name: Snyk — frontend dependencies (npm)
              continue-on-error: true
              uses: snyk/actions/node@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  command: test
                  args: --severity-threshold=high --all-projects

    # ============================================================================
    # TypeScript/React Client Apps (doctor-portal, patient-app)
    # ============================================================================
    client:
        name: Client CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Build doctor portal
              run: npm run build:doctor

            - name: Build patient app
              run: npm run build:patient

            - name: Run linting
              run: npm run lint --workspaces --if-present

    # ============================================================================
    # Performance budgets — Lighthouse CI (Phase 12.1)
    # ============================================================================
    # Report-only for now (perf is environment-noisy in CI); budgets live in
    # client/.lighthouserc.json and docs/PERFORMANCE_BUDGETS.md.
    lighthouse:
        name: Lighthouse Budgets
        runs-on: ubuntu-latest
        continue-on-error: true

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Build patient app
              run: npm run build:patient

            - name: Install Lighthouse CI
              run: npm install -g @lhci/cli@0.13.x

            - name: Run Lighthouse CI (patient app)
              run: lhci autorun --config=.lighthouserc.json --collect.staticDistDir=patient-app/dist

    # ============================================================================
    # WebAssembly Crypto Module
    # ============================================================================
    wasm:
        name: WASM Crypto CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM module
              working-directory: client/wasm-crypto
              run: wasm-pack build --target web

            - name: Run WASM tests
              working-directory: client/wasm-crypto
              run: wasm-pack test --node

    # ============================================================================
    # End-to-end suite against BOTH storage backends.
    #
    # This job exists because running the suite on the memory backend alone hid a
    # completely broken PostgreSQL path for the life of the project. Memory is a
    # HashMap: no column widths, no type coercion, no CHECK constraints. Every
    # end-to-end assertion ran against it, so PostgreSQL-only failures were
    # invisible until the backend was first exercised — at which point patient
    # registration turned out to be impossible (a 64-char SHA3 hash into a
    # VARCHAR(32)), four repository methods were unimplemented, and 16 actor
    # columns were typed uuid while the application writes wallet addresses.
    #
    # The matrix is the point: a defect that only appears on one backend must
    # fail the build. `scripts/synthetic-e2e-test.sh` already parameterises
    # BASE, so this needed no new test code.
    # ============================================================================
    e2e-both-backends:
        name: E2E (${{ matrix.backend }} backend)
        runs-on: ubuntu-latest

        strategy:
            # Always run both legs — knowing ONLY that postgres broke, without
            # knowing whether memory also broke, makes triage guesswork.
            fail-fast: false
            matrix:
                backend: [memory, postgres]

        services:
            # Started for both legs; the memory leg simply ignores it. Keeping
            # the matrix legs otherwise identical means a difference in results
            # is a difference in the BACKEND, not in the environment.
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: medichain
                    POSTGRES_PASSWORD: medichain_ci
                    POSTGRES_DB: medichain
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U medichain"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

            # Without IPFS the suite SKIPS its whole encrypted-record section
            # (upload -> encrypt -> IPFS -> download -> decrypt) rather than
            # failing, so a regression there would go unnoticed while the job
            # still reported green. A skipped section is not a passing one.
            ipfs:
                image: ipfs/kubo:v0.29.0
                ports:
                    - 5001:5001
                    - 8080:8080

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            # The suite's `jget` helper shells out to `python`, which does not
            # exist on ubuntu-latest by default (only `python3`).
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Build API
              run: cargo build --bin medichain-api

            # Two explicit steps rather than one with conditional env. An
            # empty-string MEDICHAIN_STORAGE/DATABASE_URL is SET-but-empty, not
            # unset: the memory leg would still try to open a connection to ""
            # and log a connection failure, which is noise that looks like a
            # defect. Being explicit costs a few lines and removes the ambiguity.
            - name: Start API (memory backend)
              if: matrix.backend == 'memory'
              env:
                  IS_DEMO: "true"
                  REQUIRE_SIGNATURES: "false"
                  BLOCKCHAIN_ENABLED: "false"
                  MEDICHAIN_BOOTSTRAP_KEY: synthetic-test-bootstrap-key-2026
                  PORT: "8090"
                  HOST: 127.0.0.1
                  RUST_LOG: warn
                  # 127.0.0.1, not `localhost`: the latter can resolve to ::1
                  # first and the published port is not reachable there.
                  IPFS_API_URL: http://127.0.0.1:5001
                  IPFS_GATEWAY_URL: http://127.0.0.1:8080
              run: ./scripts/ci-start-api.sh

            - name: Start API (postgres backend)
              if: matrix.backend == 'postgres'
              env:
                  IS_DEMO: "true"
                  REQUIRE_SIGNATURES: "false"
                  BLOCKCHAIN_ENABLED: "false"
                  MEDICHAIN_BOOTSTRAP_KEY: synthetic-test-bootstrap-key-2026
                  PORT: "8090"
                  HOST: 127.0.0.1
                  RUST_LOG: warn
                  MEDICHAIN_STORAGE: postgres
                  DATABASE_URL: postgres://medichain:medichain_ci@127.0.0.1:5432/medichain
              run: ./scripts/ci-start-api.sh

            # Migrations must APPLY, not merely be attempted. sqlx halts the
            # whole chain if one already-applied migration's checksum changed,
            # and in demo mode that is a warning rather than an abort — which is
            # exactly how this database drifted 31 migrations behind the code
            # without anyone noticing.
            - name: Assert migrations applied (postgres only)
              if: matrix.backend == 'postgres'
              run: |
                  if grep -q "DATABASE MIGRATIONS DID NOT APPLY" /tmp/api.log; then
                      echo "::error::Migrations did not apply — schema does not match the code"
                      grep -A 6 "DATABASE MIGRATIONS DID NOT APPLY" /tmp/api.log
                      exit 1
                  fi
                  echo "migrations applied cleanly"

            - name: Synthetic end-to-end suite
              run: BASE=http://127.0.0.1:8090 bash scripts/synthetic-e2e-test.sh

            - name: Cross-patient IDOR sweep
              run: BASE=http://127.0.0.1:8090 bash scripts/idor-sweep.sh

            - name: API log on failure
              if: failure()
              run: tail -100 /tmp/api.log

            - name: Stop API
              if: always()
              run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true
