[workspace]
resolver = "2"
members = [
    "crypto",
    "api"
]
# The blockchain crates (pallets, runtime, node) live in their own workspace at
# `blockchain/`, on a different Polkadot SDK release from this one. Keeping them
# separate is deliberate:
#
#   * A node build resolves ~1500 crates and needs ~20 GB of target output. In one
#     workspace that churn would land in the same target directory as the API.
#   * The node requires polkadot-sdk 2606 (frame-support 48); `crypto` pins
#     sp-core 38 and `api` pins sp-core 34. One workspace would force all three
#     to move together.
#
# `api` does not depend on the pallets or the runtime, so nothing here needs them.
# The one thing that IS coupled across the boundary is `subxt` below: it speaks to
# the runtime over the wire and must match its metadata format.
# See docs/BLOCKCHAIN_NODE.md for the blockchain workspace's own commands.
exclude = [
    "client/wasm-crypto",
    "blockchain"
]

[workspace.dependencies]
# Only what `api` and `crypto` actually inherit. The Substrate/FRAME dependency
# set used to live here for the pallets; it moved to `blockchain/Cargo.toml`
# along with them.
sp-core = { version = "34.0.0", default-features = false }

# subxt must understand the metadata the MediChain runtime actually emits.
# `blockchain/` is on polkadot-sdk stable2606, whose extrinsics use the
# `TransactionExtension` scheme (`AuthorizeCall`, `WeightReclaim`), extrinsic
# format v5 and metadata v16. subxt 0.37 predates all of that -- it was built for
# `SignedExtension`/v4 -- so it cannot encode a call against this runtime no
# matter how the API is configured, and it fails at runtime rather than at
# compile time. If the SDK release in blockchain/Cargo.toml moves, re-check this.
# See docs/BLOCKCHAIN_NODE.md, "subxt version is coupled to the runtime".
subxt = { version = "0.50.3" }
subxt-signer = { version = "0.50.3", features = ["sr25519", "subxt"] }
