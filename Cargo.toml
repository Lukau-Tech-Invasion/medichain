[workspace]
resolver = "2"
members = [
    "crypto",
    "api"
]
# `client/wasm-crypto` is built by wasm-pack for the browser, on its own target,
# and stays out of the workspace's dependency resolution.
exclude = [
    "client/wasm-crypto"
]

[workspace.dependencies]
# Only what `api` and `crypto` actually inherit.
#
# sr25519 wallet signature verification (`sp-core`) remains only until the
# wallet sign-in is replaced (ADR-0010, Phase C).
sp-core = { version = "34.0.0", default-features = false }
