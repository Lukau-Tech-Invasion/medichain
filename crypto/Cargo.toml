[package]
name = "medichain-crypto"
version = "0.1.0"
edition = "2021"
# The repository LICENSE is a proprietary, all-rights-reserved grant
# (Lukau Invasion (Pty) Ltd). There is no SPDX identifier for it, so it is
# named by file rather than by expression -- declaring a permissive SPDX id
# here would grant, in package metadata, exactly the rights that LICENSE
# withholds. `publish = false` keeps that metadata off a public registry.
license-file = "../LICENSE"
publish = false

[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.6", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }

# Substrate cryptography for wallet signature verification (SEC-005)
sp-core = { version = "38.0.0", default-features = false, features = ["std"] }
ss58-registry = "1.50.0"
bs58 = "0.5"
blake2 = "0.10"

[dev-dependencies]
# Benchmarking (Phase 12.1) — no OS sampling profiler needed (unlike
# cargo-flamegraph/samply, both environment-blocked here; see
# IMPLEMENTATION_PLAN.md 12.1). Measures the actual hot path directly:
# ChaCha20-Poly1305 encrypt/decrypt is on every PHI read/write.
criterion = "0.5"

[[bench]]
name = "encryption_benchmarks"
harness = false
